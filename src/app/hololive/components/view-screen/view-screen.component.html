<ng-container (window:resize)="onWindowResize()">
  <div class="select-holo">
    <button mat-raised-button (click)="openDialog()">Select videos</button>
  </div>

  @if (displayedVideos.length > 0) {
    <div class="holo-grid">
      @for (currentLiveRow of displayedVideos; track $index) {
        <div class="holo-row">
          @for (currentLive of currentLiveRow; track currentLive.yt_video_key) {
            <iframe
              [width]="getWindowWidth(currentLiveRow.length)"
              [height]="getWindowHeight()"
              [src]="getEmbeddedUrl(currentLive.yt_video_key)"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          }
        </div>
      }
    </div>
  }

</ng-container>
