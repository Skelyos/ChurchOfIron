<div class="channel-bubble-container">
  @if (currentlyLive) {
    @for (currentStream of currentlyLive.upcoming; track currentStream.id) {
      <button type="button" class="channel-bubble" (click)="handleImageSelected(currentStream)">
        <img
          [src]="currentStream.channel.photo"
          [class.selected]="findImageSelected(currentStream)"
          width="48"
          height="48"
          alt=""
        >
        <span>{{currentStream.channel.name}} - {{currentStream.title}}</span>
      </button>
    }
  }
</div>
